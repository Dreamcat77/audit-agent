[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-ai"
version = "0.1.0"
description = "Isolated OCR and textual AI infrastructure service for Audit Agent"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "uvicorn==0.52.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.test-runtime/pytest"
