openapi: 3.1.0
info:
  title: 内审系统 API - Springdoc runtime with validated conditional routes
  version: p1abc-premerge-hardening-20260922
servers:
- url: /
  description: Same-origin API
paths:
  /api/v1/blacklist/rules/{id}:
    put:
      tags:
      - blacklist-controller
      operationId: updateRule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseRuleResponse'
    delete:
      tags:
      - blacklist-controller
      operationId: deleteRule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/blacklist/rules/{id}:
    put:
      tags:
      - blacklist-controller
      operationId: updateRule_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseRuleResponse'
    delete:
      tags:
      - blacklist-controller
      operationId: deleteRule_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/v1/blacklist/entries/{id}:
    put:
      tags:
      - blacklist-controller
      operationId: updateEntry
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseEntryResponse'
    delete:
      tags:
      - blacklist-controller
      operationId: deleteEntry
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/blacklist/entries/{id}:
    put:
      tags:
      - blacklist-controller
      operationId: updateEntry_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseEntryResponse'
    delete:
      tags:
      - blacklist-controller
      operationId: deleteEntry_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
  /api/blacklist/alerts/{id}/process:
    put:
      tags:
      - blacklist-controller
      operationId: processAlert
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseAlertResponse'
  /api/v1/blacklist/alerts/{id}/process:
    put:
      tags:
      - blacklist-controller
      operationId: processAlert_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseAlertResponse'
  /api/blacklist/alerts/{id}/handle:
    put:
      tags:
      - blacklist-controller
      operationId: handleAlert
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseAlertResponse'
  /api/v1/blacklist/alerts/{id}/handle:
    put:
      tags:
      - blacklist-controller
      operationId: handleAlert_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseAlertResponse'
  /api/v1/projects:
    get:
      tags:
      - project-controller
      operationId: list
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          minLength: 0
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProjectPageResponse'
    post:
      tags:
      - project-controller
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProjectResponse'
  /api/v1/projects/creation-operations:
    get:
      tags: [project-controller]
      operationId: readCreateOperation
      description: Rediscover this actor's original project without creating another project.
      parameters:
      - name: key
        in: query
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      responses:
        '200':
          description: Original durable project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProjectResponse'
  /api/v1/projects/{projectId}/file-jobs:
    post:
      tags: [project-controller]
      operationId: acceptFile
      description: Stream and publish the original bytes, then durably enqueue parsing in a short transaction. Acceptance is not OCR completion. Existing synchronous files upload remains compatible.
      parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '202':
          description: Original file accepted with durable job identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAcceptedFileResponse'
    get:
      tags: [project-controller]
      operationId: fileJobs
      description: Counts are actual DM8 jobs, including independently queued ZIP children; no estimated percentage.
      parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Durable project queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseFileJobPageResponse'
  /api/v1/projects/{projectId}/file-jobs/by-operation:
    get:
      tags: [project-controller]
      operationId: byUploadOperation
      description: Actor-bound original operation. A null job means acceptance is still uncertain; retain the original key and never invent a new one.
      parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: key
        in: query
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      responses:
        '200':
          description: Original operation receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAcceptedFileResponse'
  /api/v1/projects/{projectId}/files/{fileId}/processing:
    get:
      tags: [project-controller]
      operationId: processing
      parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: fileId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Reopenable file processing state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseFileJobResponse'
  /api/v1/projects/{projectId}/files/{fileId}/processing/retry:
    post:
      tags: [project-controller]
      operationId: retryProcessing
      description: Audited retry of only a proven FAILED job without published parse. Preserves file/job/operation identity. UNKNOWN is not retryable here. Authentication and CSRF remain required.
      parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: fileId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Same job queued for another attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseFileJobResponse'
  /api/v1/projects/{projectId}/files:
    get:
      tags:
      - project-controller
      operationId: files
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListProjectFileResponse'
    post:
      tags:
      - project-controller
      operationId: upload
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProjectFileResponse'
  /api/v1/projects/{projectId}/files/{fileId}/recover:
    post:
      tags:
      - project-controller
      operationId: recover
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fileId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseProjectFileResponse'
  /api/v1/projects/{projectId}/contracts/{contractId}/review-runs:
    post:
      tags:
      - contract-review-run-controller
      operationId: createContractReviewRun
      summary: Freeze a durable PENDING contract review run and its step manifest
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRunRequest'
      responses:
        '202':
          description: Durable PENDING run committed; no review execution has started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReviewRunResponse'
        '409':
          description: Readiness, authority or idempotency fingerprint conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReviewRunCreateConflict'
        '404':
          description: A readiness dependency does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReviewRunCreateConflict'
  /api/v1/projects/{projectId}/contracts/{contractId}/review-runs/latest:
    get:
      tags:
      - contract-review-run-controller
      operationId: getLatestContractReviewRun
      summary: Reopen the authenticated actor's latest durable ReviewRun under this Project and Contract
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Latest owned ReviewRun with its verified durable output projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReviewRunResponse'
        '401':
          description: Authentication required
        '403':
          description: Current role is not allowed to read ReviewRuns
        '404':
          description: No ReviewRun owned by the authenticated actor exists under this Project and Contract
        '409':
          description: Latest durable ReviewRun output ownership or integrity cannot be proven
  /api/v1/projects/{projectId}/contracts/{contractId}/review-runs/{runId}:
    get:
      tags:
      - contract-review-run-controller
      operationId: reopenContractReviewRun
      summary: Read the immutable run, material and step/attempt manifest by durable ID
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Frozen durable ReviewRun projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReviewRunResponse'
        '404':
          description: Run not found under this Project and Contract
  /api/v1/projects/{projectId}/contracts/{contractId}/review-runs/{runId}/steps/{stepId}:
    get:
      tags:
      - contract-review-run-controller
      operationId: reopenContractReviewStep
      summary: Reopen one durable review step and its persisted output
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: stepId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Durable step, attempt and output projection; this operation performs no writes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReviewStepOutputResponse'
        '404':
          description: Step not found under this Project, Contract and ReviewRun
        '409':
          description: Persisted output ownership or integrity cannot be proven
  /api/v1/projects/{projectId}/contracts/{contractId}/review-runs/{runId}/steps/{stepId}/diagnostics:
    get:
      tags:
      - contract-review-step-diagnostics-controller
      operationId: getContractReviewStepDiagnostics
      summary: Read safe durable diagnostics for one exact ReviewStep
      description: 'RBAC: SYSTEM_ADMIN / AUDITOR. Owner-only, read-only, and never invokes a model.'
      security:
      - AUDITSESSION: []
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: stepId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Safe durable step, attempt and model-call diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReviewStepDiagnostics'
        '401':
          description: Authentication required
        '403':
          description: SYSTEM_ADMIN or AUDITOR role required
        '404':
          description: Exact owned run or step not found
        '409':
          description: Durable diagnostic ownership or integrity cannot be proven
  /api/v1/projects/{projectId}/contracts/{contractId}/review-runs/{runId}/steps/{stepId}/execute:
    post:
      tags:
      - contract-review-run-controller
      operationId: executeContractReviewStep
      summary: Execute the frozen first attempt and return its durable output projection
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: contractId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: stepId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
              additionalProperties: false
      responses:
        '200':
          description: Durable completed step output, including idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseReviewStepOutputResponse'
        '404':
          description: Step not found under this Project, Contract and ReviewRun
        '409':
          description: Material validation is not executable, server worker owns execution, policy drift,
            concurrency or idempotency conflict
  /api/v1/projects/{projectId}/contracts/{contractId}/review-sessions:
    get:
      tags:
      - project-review-session-controller
      operationId: listProjectReviewSessions
      summary: List Project-backed sessions that reference ProjectFile materials
      description: 'RBAC: SYSTEM_ADMIN / PROCUREMENT_MANAGER / AUDITOR / LEGAL.'
      security:
      - AUDITSESSION: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ContractId'
      responses:
        '200':
          description: Project-backed ReviewSession views
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProjectReviewSessionViewList'
        '404':
          description: Project or Contract not found
    post:
      tags:
      - project-review-session-controller
      operationId: createProjectReviewSession
      summary: Create a Project-backed ReviewSession without copying bytes or parsed text
      description: 'RBAC: SYSTEM_ADMIN / PROCUREMENT_MANAGER / AUDITOR / LEGAL. Requires session CSRF
        protection.'
      security:
      - AUDITSESSION: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectReviewSessionCreateRequest'
      responses:
        '200':
          description: Durable session and active ProjectFile reference bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProjectReviewSessionView'
        '404':
          description: Project, Contract or material not found in the supplied ownership scope
        '409':
          description: Authority, version or idempotency conflict
  /api/v1/projects/{projectId}/contracts/{contractId}/review-sessions/{sessionId}:
    get:
      tags:
      - project-review-session-controller
      operationId: getProjectReviewSession
      summary: Reopen one durable Project-backed ReviewSession
      description: 'RBAC: SYSTEM_ADMIN / PROCUREMENT_MANAGER / AUDITOR / LEGAL.'
      security:
      - AUDITSESSION: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Durable Project-backed session and active bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProjectReviewSessionView'
        '404':
          description: Session not found under this Project and Contract
  /api/v1/projects/{projectId}/contracts/{contractId}/review-sessions/{sessionId}/materials:
    get:
      tags:
      - project-review-session-controller
      operationId: listProjectReviewSessionMaterialHistory
      summary: List immutable ProjectFile binding history for the session
      description: 'RBAC: SYSTEM_ADMIN / PROCUREMENT_MANAGER / AUDITOR / LEGAL. Includes immutable active
        and inactive reference history.'
      security:
      - AUDITSESSION: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Binding history; no binary or parsed-text duplication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProjectFileBindingList'
        '404':
          description: Session not found under this Project and Contract
    post:
      tags:
      - project-review-session-controller
      operationId: replaceProjectReviewSessionMaterials
      summary: Replace the active ProjectFile reference selection
      description: 'RBAC: SYSTEM_ADMIN / PROCUREMENT_MANAGER / AUDITOR / LEGAL. Requires session CSRF
        protection.'
      security:
      - AUDITSESSION: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectReviewSessionSelectionRequest'
      responses:
        '200':
          description: Updated durable selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProjectReviewSessionView'
        '404':
          description: Scoped session or material not found
        '409':
          description: Version, authority or idempotency conflict
  /api/v1/projects/{projectId}/contracts/{contractId}/review-sessions/{sessionId}/confirm-materials:
    post:
      tags:
      - project-review-session-controller
      operationId: confirmProjectReviewSessionMaterials
      summary: Confirm Project-backed materials and make the session ready
      description: 'RBAC: SYSTEM_ADMIN / PROCUREMENT_MANAGER / AUDITOR / LEGAL. Requires session CSRF
        protection.'
      security:
      - AUDITSESSION: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ContractId'
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectReviewSessionConfirmationRequest'
      responses:
        '200':
          description: READY Project-backed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseProjectReviewSessionView'
        '409':
          description: Version, authority or idempotency conflict
        '422':
          description: Required authoritative material roles are missing
