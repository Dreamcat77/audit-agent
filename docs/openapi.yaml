components:
  securitySchemes:
    AUDITSESSION:
      type: apiKey
      in: cookie
      name: AUDITSESSION
      description: Spring Security server session; write operations also require the session CSRF header.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FindingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AcknowledgementId:
      name: acknowledgementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BundleId:
      name: bundleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
  schemas:
    ApiResponseContractFactExtractionProjection:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: '#/components/schemas/ContractFactExtractionProjection'
    ContractFactExtractionProjection:
      type: object
      required: [currentParseResultId, currentParseVersion, candidates, rejections, modelCalls]
      properties:
        currentParseResultId:
          type: string
          format: uuid
        currentParseVersion:
          type: integer
          format: int32
        attempt:
          $ref: '#/components/schemas/ContractFactExtractionAttempt'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ContractFactExtractionCandidate'
        rejections:
          type: array
          items:
            $ref: '#/components/schemas/ContractFactExtractionRejection'
        modelCalls:
          type: array
          items:
            $ref: '#/components/schemas/ContractModelCallAudit'
    ContractFactExtractionAttempt:
      type: object
      properties:
        attemptId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        fileSha256: { type: string }
        parseResultId: { type: string, format: uuid }
        parseVersion: { type: integer, format: int32 }
        canonicalTextSha256: { type: string }
        effectiveRole:
          type: string
          enum: [CONTRACT_BODY, AWARD_NOTICE, TENDER_DOCUMENT, BID_RESPONSE, SUPPLEMENT, OTHER, UNKNOWN]
        roleDecisionId: { type: string, format: uuid }
        identityDecisionId: { type: string, format: uuid }
        inputFingerprint: { type: string }
        actorId: { type: string }
        operationKey: { type: string }
        provenance:
          $ref: '#/components/schemas/ContractFactModelProvenance'
        status:
          type: string
          enum: [IN_PROGRESS, SUCCEEDED, FAILED, OUTCOME_UNKNOWN]
        callCount: { type: integer, format: int32 }
        acceptedCount: { type: integer, format: int32 }
        rejectedCount: { type: integer, format: int32 }
        failureReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        versionNo: { type: integer, format: int64 }
    ContractFactModelProvenance:
      type: object
      properties:
        provider: { type: string }
        modelName: { type: string }
        modelRevision: { type: string }
        promptVersion: { type: string }
        schemaVersion: { type: string }
    ContractFactExtractionCandidate:
      type: object
      properties:
        candidateId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        candidateKey: { type: string }
        factType: { type: string }
        groupKey: { type: string }
        valueText: { type: string }
        valueDecimal: { type: number }
        segmentId: { type: string }
        sourceLocator: { type: string }
        excerpt: { type: string }
        excerptStart: { type: integer, format: int32 }
        excerptEnd: { type: integer, format: int32 }
        contextCode: { type: string }
        confidence: { type: number }
        validationStatus: { type: string }
        validationReason: { type: string }
        publishedExtractionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    ContractFactExtractionRejection:
      type: object
      properties:
        rejectionId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        attemptNo: { type: integer, format: int32 }
        scope:
          type: string
          enum: [CORE, LINE_ITEMS, AWARD]
        providerOrdinal: { type: integer, format: int32 }
        stage:
          type: string
          enum: [TYPED_SCHEMA, SCOPE, EVIDENCE, IDENTITY]
        reasonCode: { type: string }
        safeShapeHash: { type: string }
        createdAt: { type: string, format: date-time }
    ContractModelCallAudit:
      type: object
      properties:
        callAuditId: { type: string, format: uuid }
        factExtractionAttemptId: { type: string, format: uuid }
        reviewStepAttemptId: { type: string, format: uuid }
        attemptNo: { type: integer, format: int32 }
        scope:
          type: string
          enum: [CORE, LINE_ITEMS, AWARD]
        callOrdinal: { type: integer, format: int32 }
        phase:
          type: string
          enum: [TRANSPORT, REPAIR]
        requestFingerprint: { type: string }
        provider: { type: string }
        modelName: { type: string }
        outcome:
          type: string
          enum: [SUCCEEDED, FAILED]
        safeReason: { type: string }
        durationMs: { type: integer, format: int64 }
        finishReason: { type: string }
        promptTokens: { type: integer, format: int32 }
        completionTokens: { type: integer, format: int32 }
        totalTokens: { type: integer, format: int32 }
        batchStatus:
          type: string
          enum: [EMPTY, PARTIAL, COMPLETE, FAILED]
        createdAt: { type: string, format: date-time }
    SupportAuthorityReplacementRequest:
      type: object
      additionalProperties: false
      required:
      - expectedCandidateVersion
      - supportFileIds
      properties:
        expectedCandidateVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775806
