  /api/v1/projects/{projectId}/contract-candidates/{candidateId}/support-authority-replacements:
    post:
      tags:
      - project-controller
      operationId: replaceSupportAuthority
      description: Replace the complete AWARD_NOTICE support set of a DRAFT Candidate. Requires an authenticated
        SYSTEM_ADMIN, PROCUREMENT_MANAGER, AUDITOR or LEGAL session and CSRF protection. Authority tuples
        are resolved by the server. Successful same-key retries replay the original result only while
        that durable Candidate/cohort remains current, without advancing versions.
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: candidateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportAuthorityReplacementRequest'
      responses:
        '200':
          description: Committed replacement or proven replay of the current durable result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupportAuthorityReplacementResponse'
        '400':
          description: Invalid JSON, UUID, version, key, extra request field or more than 39 canonical
            distinct support IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '403':
          description: Role denied or CSRF protection failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '404':
          description: Project-scoped Candidate or file not found; REQUEST_REJECTED when no same-key winner
            exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupportAuthorityReplacementError'
        '409':
          description: Original business conflict with endpoint-local recovery classification. REQUEST_REJECTED
            proves deterministic rejection without a durable winner; OUTCOME_UNCERTAIN retains the operation;
            RESULT_SUPERSEDED proves a later durable mutation; INTEGRITY_CONFLICT retains the operation
            for investigation. Do not infer classification from the status or message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupportAuthorityReplacementError'
        '500':
          description: Internal failure. A classified exception carries OUTCOME_UNCERTAIN; unclassified
            proxy or transport failures keep the generic envelope. Clients must retain the same operation
            identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupportAuthorityReplacementError'
        default:
          description: Original business status and message are preserved; unclassified failures remain
            generic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSupportAuthorityReplacementError'
